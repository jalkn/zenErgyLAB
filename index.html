<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZENERGY.LAB - Studio UI</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Electrolize&display=swap" rel="stylesheet">
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* =========================================================================
           1. CORE DESIGN SYSTEM & NATIVE CSS VARIABLES
           ========================================================================= */
        :root {
            --bg-base: #020617;
            --sky-glow: rgba(0, 210, 254, 0.15);
            --sky-border: rgba(14, 165, 233, 0.3);
            --sky-accent: #00D2FE;
            --text-main: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.6);
            --font-tech: 'Orbitron', monospace, sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        /* Reset & Base Layout */
        *, ::before, ::after { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: var(--font-body); 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        } 

        ::selection {
            background-color: #ffffff;
            color: #000000;
        }

        /* Contenedor Principal Canvas 9:16 Studio */
        #studio-canvas {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 746px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background: radial-gradient(circle at 50% 45%, #0f2b48 0%, #081325 55%, #020617 100%);
            overflow: hidden;
        }

        /* BLOQUE 1: HEADER & LOGO COMPACTO */
        .header-container {
            width: 100%;
            flex-shrink: 0;
            z-index: 50;
            background: rgba(2, 6, 23, 0.4);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--sky-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 0 0.6rem 0;
        }

        .brand-text-html {
            font-family: 'Electrolize', sans-serif;
            font-size: 1.6rem;
            font-weight: 600;
            text-transform: lowercase;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .zen-part { color: #00D2FE; font-weight: 700; }
        .ergy-part { color: #FFFFFF; font-weight: 400; }

        .header-slogan {
            font-family: var(--font-tech);
            font-size: 8px;
            letter-spacing: 0.35em;
            color: var(--sky-accent);
            text-transform: uppercase;
            margin-top: 0.35rem;
            opacity: 0.85;
            white-space: nowrap;
        }

        /* BLOQUE 2: ÁREA VISUAL CENTRAL */
        .main-visualizer-container {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0.5rem 1rem;
        }

        #zenergy-pack-container {
            position: relative;
            width: 100%;
            max-width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #zenergy-pack-container::before {
            content: '';
            position: absolute;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(0, 210, 254, 0.35) 0%, rgba(0, 210, 254, 0.08) 45%, rgba(2, 6, 23, 0) 70%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }

        #zenergy-pack-img-back {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 18px rgba(0, 210, 254, 0.25)) contrast(105%);
            transition: opacity 0.3s ease-in-out;
        }

        /* BLOQUE 3: SCRIPT ANIMADO (DESPLAZADO 10PX HACIA ARRIBA) */
        .block-script {
            width: 100%;
            padding: 0 1.8rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
            min-height: 140px;
            justify-content: center;
            transform: translateY(-10px); /* Subido 10px para desapegarlo del footer */
        }

        .shroom-badge {
            font-family: var(--font-tech);
            font-size: 8px;
            letter-spacing: 0.2em;
            color: var(--sky-accent);
            background: rgba(0, 210, 254, 0.08);
            border: 1px solid var(--sky-border);
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
            backdrop-filter: blur(4px);
            display: inline-block;
        }

        .shroom-badge,
        .script-hook, 
        .script-benefit, 
        .script-cta {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .script-element-visible {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .script-hook {
            color: var(--sky-accent);
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.35;
        }

        .script-benefit {
            color: var(--text-main);
            font-size: 0.78rem;
            line-height: 1.45;
            opacity: 0.9;
            font-weight: 300;
        }

        .script-cta {
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }

        /* BLOQUE 4: CONTROLES */
        .action-controls-grid {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--sky-border);
            align-items: center;
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(8px);
        }

        .btn-tele-glass {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--sky-border);
            border-radius: 6px;
            padding: 0.5rem 0.9rem;
            display: flex;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            font-family: var(--font-tech);
            font-size: 0.65rem;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-tele-glass:hover {
            background-color: var(--sky-glow);
            border-color: var(--sky-accent);
        }

        .btn-capture {
            background-color: var(--sky-accent);
            color: #020617;
            font-weight: 700;
            border: 1px solid var(--sky-accent);
        }

        .icon-stroke { 
            width: 0.9rem; 
            height: 0.9rem; 
            stroke: currentColor; 
        }
    </style>
</head>
<body>

    <div id="studio-canvas">
        <header class="header-container">
            <div class="brand-text-html">
                <span class="zen-part">zen</span><span class="ergy-part">ergy.lab</span>
            </div>
            <div class="header-slogan">mente · cuerpo · sinergia</div>
        </header>

        <main class="main-visualizer-container">
            <div id="zenergy-pack-container">
                <img id="zenergy-pack-img-back" src="img/44mane.png" alt="Biopulsor Hongo" />
            </div>
        </main>

        <div class="block-script">
            <div class="shroom-badge" id="shroom-badge">LION'S MANE // BIOPULSOR FOCUS</div>
            <p class="script-hook" id="script-hook">Cargando script...</p>
            <p class="script-benefit" id="script-benefit">...</p>
            <p class="script-cta" id="script-cta">...</p>
        </div>

        <div class="action-controls-grid" id="ui-controls">
            <button id="btn-next-variant" class="btn-tele-glass">
                <span>SIGUIENTE DÍA</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" class="icon-stroke">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
            </button>
            <button id="btn-capture" class="btn-tele-glass btn-capture">
                <span>CAPTURAR MP4 (10S)</span>
            </button>
        </div>
    </div>

    <script>
        const ZENERGY_SCRIPT_CATALOG = [
            {
                dia: "lunes",
                badge: "LION'S MANE // BIOPULSOR FOCUS",
                imgBack: "img/44mane.png",
                gancho: "¿Te ha pasado que intentas concentrarte y tu mente no para?",
                beneficio: "La Melena de León te ayuda a recuperar la atención plena y mejorar el enfoque mental de forma natural.",
                llamado_a_la_accion: "¿Quieres saber cómo incluirla en tu rutina?"
            },
            {
                dia: "martes",
                badge: "REISHI // BIOPULSOR ZEN",
                imgBack: "img/44reishi.png",
                gancho: "¿Sientes el estrés del día a día y te cuesta descansar?",
                beneficio: "El Reishi te brinda esa calma y ayuda a recuperar el equilibrio para que duermas profundo.",
                llamado_a_la_accion: "¿Te gustaría conocer más sobre este hongo?"
            },
            {
                dia: "miercoles",
                badge: "CORDYCEPS // BIOPULSOR STAMINA",
                imgBack: "img/44cordy.png",
                gancho: "¿Tu energía cae a mitad de tarde?",
                beneficio: "El Cordyceps es tu aliado natural para aumentar la resistencia y mantenerte activo durante todo el día.",
                llamado_a_la_accion: "¿Quieres darle un impulso a tus días?"
            },
            {
                dia: "jueves",
                badge: "TURKEY TAIL // BIOPULSOR CORE",
                imgBack: "img/44turkey.png",
                gancho: "¿Buscas fortalecer tus defensas de forma natural?",
                beneficio: "La Cola de Pavo es rica en antioxidantes que cuidan tu salud desde adentro.",
                llamado_a_la_accion: "¿Te gustaría saber cómo incorporarla?"
            },
            {
                dia: "viernes",
                badge: "TREMELLA // BIOPULSOR GLOW",
                imgBack: "img/44treme.png",
                gancho: "¿Sientes tu piel seca y sin vida?",
                beneficio: "La Tremella le devuelve la hidratación profunda desde el interior y potencia su luminosidad.",
                llamado_a_la_accion: "¿Te gustaría lucir una piel más radiante?"
            }
        ];

        let currentDayIndex = 0;

        const dom = {
            packImgBack: document.getElementById('zenergy-pack-img-back'),
            badge: document.getElementById('shroom-badge'),
            hook: document.getElementById('script-hook'),
            benefit: document.getElementById('script-benefit'),
            cta: document.getElementById('script-cta'),
            btnNext: document.getElementById('btn-next-variant'),
            btnCapture: document.getElementById('btn-capture'),
            controlsUI: document.getElementById('ui-controls'),
            studioCanvas: document.getElementById('studio-canvas')
        };

        function rotateDay() {
            currentDayIndex = (currentDayIndex + 1) % ZENERGY_SCRIPT_CATALOG.length;
            updateStudioUI();
        }

        function updateStudioUI() {
            const currentItem = ZENERGY_SCRIPT_CATALOG[currentDayIndex];
            if (dom.packImgBack) {
                dom.packImgBack.style.opacity = '0';
                
                [dom.badge, dom.hook, dom.benefit, dom.cta].forEach(el => el.classList.remove('script-element-visible'));

                setTimeout(() => {
                    dom.packImgBack.src = currentItem.imgBack;
                    if (dom.badge) dom.badge.textContent = currentItem.badge;
                    if (dom.hook) dom.hook.textContent = currentItem.gancho;
                    if (dom.benefit) dom.benefit.textContent = currentItem.beneficio;
                    if (dom.cta) dom.cta.textContent = currentItem.llamado_a_la_accion;
                    
                    dom.packImgBack.style.opacity = '1';
                    
                    [dom.badge, dom.hook, dom.benefit, dom.cta].forEach(el => el.classList.add('script-element-visible'));
                }, 120);
            }
        }

        async function record10sVideoMP4() {
            dom.controlsUI.style.display = 'none';

            [dom.badge, dom.hook, dom.benefit, dom.cta].forEach(el => el.classList.remove('script-element-visible'));

            const renderCanvas = document.createElement('canvas');
            renderCanvas.width = 840;
            renderCanvas.height = 1492;
            const ctx = renderCanvas.getContext('2d');

            const stream = renderCanvas.captureStream(30);
            
            // Preferencia por contenedor MP4 / H264
            let mimeType = 'video/mp4;codecs=avc1.42E01E';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/mp4';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm';
                }
            }

            const mediaRecorder = new MediaRecorder(stream, { mimeType });
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const isMp4 = mimeType.includes('mp4');
                const blob = new Blob(chunks, { type: isMp4 ? 'video/mp4' : 'video/webm' });
                const url = URL.createObjectURL(blob);
                const currentDay = ZENERGY_SCRIPT_CATALOG[currentDayIndex].dia;
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `zenergy-${currentDay}-10s.${isMp4 ? 'mp4' : 'webm'}`;
                a.click();
                URL.revokeObjectURL(url);

                dom.controlsUI.style.display = 'flex';
                dom.packImgBack.style.transform = 'none';
            };

            let isRecording = true;
            const renderLoop = async () => {
                if (!isRecording) return;
                try {
                    const canvasFrame = await html2canvas(dom.studioCanvas, {
                        backgroundColor: '#020617',
                        scale: 2,
                        useCORS: true
                    });
                    ctx.clearRect(0, 0, renderCanvas.width, renderCanvas.height);
                    ctx.drawImage(canvasFrame, 0, 0);
                } catch (e) {
                    console.error(e);
                }
                if (isRecording) requestAnimationFrame(renderLoop);
            };

            dom.packImgBack.style.transition = 'transform 10s linear';
            dom.packImgBack.style.transform = 'scale(1.08)';

            mediaRecorder.start();
            renderLoop();

            // Timeline animación secuencial en 10 segundos
            setTimeout(() => dom.badge.classList.add('script-element-visible'), 300);
            setTimeout(() => dom.hook.classList.add('script-element-visible'), 1200);
            setTimeout(() => dom.benefit.classList.add('script-element-visible'), 3800);
            setTimeout(() => dom.cta.classList.add('script-element-visible'), 6800);

            setTimeout(() => {
                isRecording = false;
                mediaRecorder.stop();
            }, 10000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (dom.btnNext) dom.btnNext.addEventListener('click', rotateDay);
            if (dom.btnCapture) dom.btnCapture.addEventListener('click', record10sVideoMP4);
            updateStudioUI();
        });
    </script>
</body>
</html>
